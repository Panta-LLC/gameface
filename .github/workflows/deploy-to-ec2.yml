name: Deploy to EC2 (Docker Compose)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        app: [api, signaling, web]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push ${{ matrix.app }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/gameface-${{ matrix.app }}:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/gameface-${{ matrix.app }}:latest
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,scope=${{ matrix.app }},mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare SSH key
        run: |
          set -euo pipefail
          SSH_DIR="$HOME/.ssh"
          mkdir -p "$SSH_DIR"
          chmod 700 "$SSH_DIR"

          if [ -z "${{ secrets.EC2_SSH_PRIVATE_KEY }}" ]; then
            echo "ERROR: secret EC2_SSH_PRIVATE_KEY is not set."
            exit 1
          fi

          printf '%s\n' "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > "$SSH_DIR/id_rsa"
          chmod 600 "$SSH_DIR/id_rsa"

          if [ -n "${{ secrets.EC2_HOST }}" ]; then
            ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> "$SSH_DIR/known_hosts" || true
          fi

      - name: Verify SSH connectivity
        run: |
          set -euo pipefail
          if [ -z "${{ secrets.EC2_HOST }}" ]; then
            echo "ERROR: EC2_HOST secret is not set."
            exit 1
          fi
          ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o ConnectTimeout=10 \
            -i "$HOME/.ssh/id_rsa" \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" 'echo connected'

      - name: Copy compose files to host
        run: |
          set -euo pipefail
          scp -o StrictHostKeyChecking=no -i "$HOME/.ssh/id_rsa" \
            infra/ec2/docker-compose.prod.yml \
            infra/ec2/Caddyfile \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/home/${{ secrets.EC2_USER }}/"

      - name: Deploy via docker compose
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          ssh -o StrictHostKeyChecking=no -i "$HOME/.ssh/id_rsa" \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
            DOCKERHUB_USERNAME="$DOCKERHUB_USERNAME" \
            DOCKERHUB_TOKEN="$DOCKERHUB_TOKEN" \
            IMAGE_TAG="$IMAGE_TAG" \
            'bash -s' <<'REMOTE'
          set -euo pipefail

          # Phase 0: env_file is referenced by compose but secrets land in
          # Phase 2. Until then, ensure the file exists so compose doesn't
          # error on the volume mount.
          sudo mkdir -p /etc/gameface
          sudo touch /etc/gameface/.env
          sudo chmod 600 /etc/gameface/.env

          # Install docker compose plugin if missing (Ubuntu 22.04 default
          # docker.io package ships v1 only; v2 is the `docker compose` CLI).
          if ! docker compose version >/dev/null 2>&1; then
            echo "Installing docker compose plugin..."
            sudo mkdir -p /usr/local/lib/docker/cli-plugins
            sudo curl -fsSL \
              https://github.com/docker/compose/releases/download/v2.29.7/docker-compose-linux-x86_64 \
              -o /usr/local/lib/docker/cli-plugins/docker-compose
            sudo chmod +x /usr/local/lib/docker/cli-plugins/docker-compose
          fi

          echo "$DOCKERHUB_TOKEN" | sudo docker login -u "$DOCKERHUB_USERNAME" --password-stdin

          cd "$HOME"
          export DOCKERHUB_USERNAME IMAGE_TAG

          sudo --preserve-env=DOCKERHUB_USERNAME,IMAGE_TAG \
            docker compose -f docker-compose.prod.yml pull
          sudo --preserve-env=DOCKERHUB_USERNAME,IMAGE_TAG \
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

          # Prune dangling images to keep the t3a.small disk happy.
          sudo docker image prune -f
          REMOTE

      - name: Smoke test
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5 6; do
            if curl -fsS --max-time 5 "http://${{ secrets.EC2_HOST }}/healthz" >/dev/null; then
              echo "healthz OK"
              break
            fi
            echo "Waiting for caddy ($i/6)..."
            sleep 5
          done
          curl -fsS --max-time 5 "http://${{ secrets.EC2_HOST }}/healthz"
          curl -fsS --max-time 5 "http://${{ secrets.EC2_HOST }}/api/health"
