# DEFERRED: ECS Fargate deployment path.
#
# The Terraform under terraform_deferred/ only defines ECR repos and an empty
# ECS cluster — VPC/ALB/IAM/task-definitions are missing. Until that's fleshed
# out (post-beta), the canonical deploy is .github/workflows/deploy-to-ec2.yml.
#
# This workflow is left as a stub so the original wiring is preserved. It runs
# only on manual workflow_dispatch and refuses to do anything until the deferred
# infra is restored.

name: (Deferred) Build and Deploy to ECR + Terraform

on:
  workflow_dispatch:

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse to run
        run: |
          echo "::error::This workflow targets the deferred ECS path."
          echo "Use deploy-to-ec2.yml for the active EC2 deployment."
          echo "To re-enable: restore terraform_deferred/ to terraform/, finish"
          echo "VPC/ALB/IAM/task-definitions, then re-add push triggers and the"
          echo "build-and-push + terraform jobs (see git history for previous content)."
          exit 1
